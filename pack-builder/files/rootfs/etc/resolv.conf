# PMB OS fallback resolver configuration, read by the imagefs glibc as
# $PMBOS_ROOTFS/etc/resolv.conf. The PMB OS launcher overwrites this file before every
# launch with the DNS servers of the active Android network (ConnectivityManager); these
# public resolvers are only used when it could not determine any.
nameserver 1.1.1.1
nameserver 8.8.8.8
options timeout:2 attempts:2
