<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PMB OS fontconfig root configuration.
  @ROOTFS@ is replaced with the absolute imagefs path at install time (pmbpack.json
  "textPatch"). Point fontconfig here with FONTCONFIG_FILE=<imagefs>/etc/fonts/fonts.conf.
-->
<fontconfig>
	<!-- fonts shipped in the imagefs (DejaVu, Liberation) -->
	<dir>@ROOTFS@/usr/share/fonts</dir>
	<!-- Android system fonts (Roboto, Noto incl. CJK/emoji) are world readable -->
	<dir>/system/fonts</dir>
	<dir>/product/fonts</dir>

	<!-- writable cache inside the imagefs -->
	<cachedir>@ROOTFS@/var/cache/fontconfig</cachedir>

	<!-- Debian's rule set (aliases, hinting, metric-compatible substitutions) -->
	<include ignore_missing="yes">@ROOTFS@/etc/fonts/conf.d</include>

	<config>
		<rescan>
			<int>30</int>
		</rescan>
	</config>
</fontconfig>
